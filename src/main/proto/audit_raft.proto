syntax = "proto3";
package auditraft;
option java_multiple_files = true;
option java_package = "com.auditraft.grpc";
service RaftInternalService {
  rpc RequestVote (VoteRequest) returns (VoteResponse);
  rpc AppendEntries (AppendRequest) returns (AppendResponse);
}
message VoteRequest { int64 term = 1; string candidate_id = 2; int64 last_log_index = 3; int64 last_log_term = 4; }
message VoteResponse { int64 term = 1; bool vote_granted = 2; }
message AppendRequest { int64 term = 1; string leader_id = 2; int64 prev_log_index = 3; int64 prev_log_term = 4; int64 leader_commit = 6; }
message AppendResponse { int64 term = 1; bool success = 2; }
